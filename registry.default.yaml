# Default model registry — orchestrator-side config, NOT part of the skill.
#
# Agents never read this file. Only the router does. 
#
# Two things live here and they are different:
#   * Capability scores + tier bands  -> reference data, the same for everyone.
#     Inherit these; do not hand-tune them without evidence from telemetry.
#   * enrolled + policy               -> yours. `delegate init` proposes them by
#     detecting which agent CLIs are signed in; you confirm once.
#
# Enrollment is FAIL-CLOSED: a model with `enrolled: false` is invisible to the
# router no matter how capable. That is how a tier stays off by default —
# there is no denylist to maintain.

version: 1

# ---------------------------------------------------------------------------
# Capability vocabulary (1-5 unless noted)
#   reasoning   planning, tradeoffs, root-causing
#   coding      writing correct code in-idiom
#   adherence   stays in scope, follows the protocol, writes valid reports
#   tool        agentic edit/run loops without derailing
#   speed       1 slow ... 5 fast
#   ctx         usable context window
#   cost_*      USD per million tokens, list price (metered channels only)
#   tier        t1 cheap/fast | t2 the workhorse | t3 the strongest enrolled
#
# ONE model per band, and that is the point: a job asks for a tier, so a tier
# has to name something. When t2 held both the workhorse and the strong model,
# `tier: t2` could not say which -- the score decided, the strong one never won
# an implementation, and "the default provider for t2" had no answer.
# ---------------------------------------------------------------------------

models:
  # --- t2: strong. The working ceiling for most deployments. ----------------
  opus-class-strong:
    tier: t3
    reasoning: 5
    coding: 5
    adherence: 4
    tool: 5
    speed: 2
    ctx: 200000
    cost_in: 15
    cost_out: 75
    enrolled: true
    notes: >
      The hard job in a batch. A job asks for it by name -- `tier: t3` -- and
      nothing else reaches it: selection is an exact band, and the worker
      profile weights speed, so this scores below balanced-coder and would never
      win a job that did not ask for the band.

  balanced-coder:
    tier: t2
    reasoning: 4
    coding: 5
    adherence: 4
    tool: 5
    speed: 4
    ctx: 200000
    cost_in: 3
    cost_out: 15
    enrolled: true
    notes: The workhorse. Most implementation should land here.

  # --- t1: cheap/fast. Predictable work only. -------------------------------
  fast-cheap:
    tier: t1
    reasoning: 2
    coding: 3
    adherence: 3
    tool: 3
    speed: 5
    ctx: 1000000
    cost_in: 0.3
    cost_out: 1.5
    enrolled: true
    notes: Mechanical, high-volume jobs with little judgement in them.

  # --- t3: ultra. Present, scored, DELIBERATELY UNUSED. ---------------------
  # Enrolling this alone does nothing: policy.escalation_ceiling must also be
  # raised to t3. Two independent switches, on purpose.
  ultra-reasoner:
    tier: t3
    reasoning: 5
    coding: 5
    adherence: 4
    tool: 5
    speed: 1
    ctx: 1000000
    cost_in: 25
    cost_out: 125
    enrolled: false
    notes: >
      Heaviest reasoning tier. Large marginal cost and latency for usually
      marginal gain on coding work. Turn on only for a specific hard problem,
      and prefer re-decomposing the job or asking a human first.

# ---------------------------------------------------------------------------
# What a job needs. One profile, because there is one kind of job: something the
# caller decomposed, run in a worktree. Which MODEL serves it is decided by the
# job's `tier`, not by a role -- a role names which instructions an agent reads
# and stopped naming which model runs it.
#
# `require` is a floor every candidate must clear whatever its tier; `weights`
# rank what is left. Both apply within a band, so they only ever choose between
# models the caller's tier already admitted.
# ---------------------------------------------------------------------------

profiles:
  worker:
    require: {coding: 3, tool: 3}
    weights: {coding: 3, adherence: 2, speed: 1}
    cost_sensitivity: high

# ---------------------------------------------------------------------------
# Access channels — how models are actually reachable. Written by
# `delegate init` from detected agent CLIs; edit if detection is wrong.
#
#   adapter    which runtime adapter runs it: herdr | local | mock
#   agent_kind which agent CLI to launch — adapter-independent
#
# There is deliberately no `session` key. The herdr adapter starts an agent from
# `agent_kind` alone (adg/runtime.py HerdrAdapter.start_agent) and never attaches
# to a named pre-authenticated session, so one declared here would be read by
# nothing while reading like the seat's identity.
#
# Swapping `adapter: herdr` for `adapter: local` must change nothing except who
# spawns the process. If it changes the workflow, the boundary has leaked.
#
# For a subscription seat the marginal cost of a call is ~0 while the quota
# window has headroom, so the router weights quota draw, not list price.
# ---------------------------------------------------------------------------

# The tier -> default provider table this produces. A job names a tier; the tier
# names a model; `prefers` names the seat that should serve it when more than
# one can. This is the contract a calling skill picks from, so it has to be
# legible here rather than emergent:
#
#     t1  fast-cheap         cursor-seat     mechanical, high volume
#     t2  balanced-coder     cursor-seat     the workhorse; most jobs
#     t3  opus-class-strong  claude-seat     the hard one in the batch
#
# `prefers` is load-bearing for t2, where both seats expose the model: without
# it the tie fell to the alphabet and every job went to claude-seat. It is a
# preference and not a pin -- a cooled or drawn-down seat still yields, which is
# the entire point of the program.

channels:
  claude-seat:
    type: subscription
    adapter: herdr
    agent_kind: claude
    exposes: [opus-class-strong, balanced-coder]
    # Which of the models it exposes this seat should WIN when another seat
    # exposes the same one and both have headroom. Two subscription seats with
    # room both price at ~0, so that choice used to fall to the alphabetical
    # tie-break in `candidates` -- "claude-seat" < "cursor-seat" -- and a
    # two-provider deployment quietly ran every role on one.
    #
    # A preference, not a pin: it is worth `router.PREFERENCE_BONUS`, which is
    # less than the smallest gap between two different capability scores, so it
    # decides ties and nothing else. When this seat is cooled, reserved out or
    # drawn down, the work still moves -- which is the whole point of the
    # project and must not be undone by a routing preference.
    prefers: [opus-class-strong]
    quota: {window: 5h, est_capacity: 40, weekly_cap: true}
    # Keep headroom for the call that arrives LAST and cannot be deferred. The
    # integrator is dispatched mid-merge, after every job in the wave has been
    # paid for; a seat drawn down by the wave itself and then unable to serve
    # the reconciliation strands finished work on unmerged branches.
    #
    # It used to read `[planner, reviewer]`, roles this program stopped
    # dispatching -- so the reservation withheld the seat from every role that
    # does run, on behalf of none that do.
    reserve_for: [integrator]
    reserve_fraction: 0.3

  cursor-seat:
    type: subscription
    adapter: herdr
    agent_kind: cursor
    exposes: [balanced-coder, fast-cheap]
    # The other half of the split: the workhorse band lands here, the strong
    # band on claude-seat. Both seats expose `balanced-coder`, so without this
    # the whole wave went to claude-seat on alphabet alone.
    prefers: [balanced-coder, fast-cheap]
    quota: {window: monthly, est_capacity: 500}

  # Same seat without herdr — e.g. on Windows, or in CI. Identical workflow.
  # claude-local:
  #   type: subscription
  #   adapter: local
  #   agent_kind: claude
  #   exposes: [opus-class-strong, balanced-coder]

  # DeepSeek Harness, headless. Commented out because it is nobody's default:
  # enrolling a seat is a deliberate edit, and this one is pinned to a release
  # candidate of a project that promises compatibility-breaking changes.
  #
  # PINNED TO @deepseek-ai/dsh@0.1.0-rc.6. What was verified against that
  # version and what was only inferred is in
  # orchestrator/docs/dsh-adapter-notes.md — read it before raising the pin.
  #
  # `type: metered`, and NO `quota:` block, deliberately. This is an API-billed
  # seat: there is no subscription window to draw down, so there is no
  # utilisation to meter and no headroom to estimate. `delegate status` renders
  # it as "no capacity estimate" rather than inventing a percentage, which is
  # the no-fabricated-headroom rule doing its job — a seat that reported "100%
  # left" is exactly the number somebody would dispatch a wave on.
  #
  # Enrichment (token counts, the structured failure) reads the persisted
  # session log, which dsh writes Zstandard-compressed by default and this
  # program cannot decompress with the standard library alone. To get it, set
  # `compression: none` on the session-persistence-jsonl plugin in the headless
  # profile. Without that the seat still works; it just bills from nothing and
  # classifies from stderr only.
  # dsh-seat:
  #   type: metered
  #   adapter: local
  #   agent_kind: dsh
  #   exposes: [balanced-coder]

# ---------------------------------------------------------------------------
# Policy. Composes DOWN only: a repo or a single task may lower these,
# never raise them.
# ---------------------------------------------------------------------------

policy:
  # A SELECTION bound, not a runtime guard. `max_tier` filters which
  # (model, channel) slots the router will choose; it never reaches the process.
  # The adapter launches an agent CLI by kind and does not pin a model
  # (adg/runtime.py LAUNCH), so what actually executes is whatever that CLI is
  # configured to use. Lowering max_tier cannot stop a heavy model your CLI
  # already defaults to, and raising it cannot summon one it does not have.
  # The bound that does hold at runtime is `limits.max_cost_usd`, which is
  # checked against the cost the CLI reports back per call.
  #
  # `max_marginal_cost_per_call: 2.50` sat here and was read by nothing --
  # `router._within_ceiling` reads max_tier and stops -- while the paragraph
  # above claimed both entries filtered selection. That is the same failure mode
  # as the gates removed from `human_approval_required` below: a policy naming a
  # control that does not exist reads as protection and is not. Add it back in
  # the same commit that makes the router price a slot against it.
  escalation_ceiling:
    max_tier: t3                      # the strongest ENROLLED tier; ultra is off
  # Deployment defaults for task.json `limits`.
  # A task may lower any of these; never raise. Missing/invalid -> fail closed.
  limits:
    max_cost_usd: 15
    # How many times one job's approach may be retried on its own seat against
    # the checks. A quota wall is not one of those times -- it is a routing
    # event, and the hop happens below this loop.
    max_attempts_per_subtask: 8
    max_parallel_agents: 3
    # The one gate the machine has. `design`, `plan`, `dependency_change` and
    # `destructive_op` were listed here and implemented nowhere -- a policy
    # naming a control that does not exist reads as protection and is not,
    # which is the same failure mode as a `max_cost_usd` that cannot bind.
    # Add one back in the same commit that adds the gate.
    human_approval_required: [merge]
  # No `mode:` key. attended/autonomous is a per-task decision: `delegate run
  # --mode` (default attended, adg/cli.py) writes it into task.json, and nothing
  # consults a deployment-wide default. One declared here read as the switch for
  # the whole deployment and moved nothing -- including, silently, `autonomous`,
  # which is the setting whose failure mode is a pushed branch nobody asked for.
