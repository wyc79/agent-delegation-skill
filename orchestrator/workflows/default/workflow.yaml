# The bundled workflow: delegate places the jobs you supply onto seats.
#
# There used to be a role protocol here -- a planner decomposed, a reviewer
# ruled -- and it was measured against a caller doing the same work in one warm
# context. It cost 4x the money, 4x the wall clock and 4x the tokens for an
# identical result. What is left is the part no model release makes redundant:
# N jobs, placed on whichever enrolled seat can run them, in isolated worktrees,
# with quota metering, breakers and cross-provider failover underneath.
#
# You supply the decomposition. Nothing here will second-guess it, review the
# result, or retry a stuck job on a dearer model -- those are the caller's
# decisions and the caller already has skills that make them.
#
#     delegate run "<what this is>" --plan my-jobs.md
#
# `--plan` is written to the task's plan.md, which is where the machine looks
# for jobs when the task has none.
#
# A manifest cannot invent a stage: the state machine owns the graph
# (`machine.STAGES`), and this file only says which parts of it run and where
# the instructions its agent reads live. Naming a stage the machine does not
# have would read like policy and route nothing, so the two stages below are
# the two there are.
#
# Nor can it declare METHOD. A `discipline:` key used to let a stage borrow a
# working style from an installed companion skill; nothing ever read it, and
# telling a dispatched agent how to work is the caller's business. Point
# `--workflow` at your own directory to change what an agent READS -- that is
# location, and it is supported.

name: default
description: >
  Execution. The caller supplies the jobs; delegate places them on seats, runs
  each in an isolated worktree, and integrates what comes back.

# Read by every dispatched agent before its card. The worktree contract: what
# isolation means, what the scope boundary is, and what to do when stuck.
protocol: PROTOCOL.md

stages:

  implement:
    role: implementer
    card: roles/worker.md

  # Merges the job branches and writes the patch. Disabling it would end a run
  # with the work stranded on branches nobody merges.
  integrate:
    role: integrator
    card: roles/integrator.md
